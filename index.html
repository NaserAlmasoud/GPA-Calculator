<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234345c2%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2215%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EA+%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply saved language and theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('gpa-calculator:v1') || 'null');
        var st = s && s.settings;
        if (st && st.lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        if (st && (st.theme === 'dark' || st.theme === 'light')) document.documentElement.dataset.theme = st.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
